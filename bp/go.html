<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6b75">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ضغط الدم">
<link rel="apple-touch-icon" href="icon.png">
<title>سجل ضغط الدم</title>
<style>
html,body{margin:0;height:100%}
body{display:grid;place-items:center;background:linear-gradient(135deg,#1f6b75,#223a58 60%,#25304f);color:#fff;font:600 22px/1.5 -apple-system,system-ui,sans-serif;text-align:center}
a{color:#9fe3dc}
</style>
</head>
<body>
<div><img src="icon.png" width="96" height="96" alt="" style="border-radius:22px;display:block;margin:0 auto 14px"><div id="m">جارٍ فتح السجل…</div></div>
<script>
(function(){
  var R='MOON20202020/alwan-updates';
  function go(sha){location.replace('https://raw.githack.com/'+R+'/'+sha+'/bp/index.html')}
  var saved=null;try{saved=localStorage.getItem('bp-sha')}catch(e){}
  fetch('https://api.github.com/repos/'+R+'/commits/main',{cache:'no-store'})
    .then(function(r){return r.ok?r.json():null})
    .then(function(j){if(j&&j.sha){try{localStorage.setItem('bp-sha',j.sha)}catch(e){}go(j.sha)}else if(saved)go(saved);else fail()})
    .catch(function(){saved?go(saved):fail()});
  function fail(){document.getElementById('m').innerHTML='تعذّر الاتصال. تحقق من الإنترنت ثم <a href="">أعد المحاولة</a>.'}
})();
</script>
</body>
</html>
